spring.application.name=shorty-url
server.port=8080

spring.datasource.url=jdbc:h2:mem:shortyurl;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.security.user.name=merchant
spring.security.user.password=merchant

shortyurl.public-base-url=http://localhost:8080/

shortyurl.liveness.max-attempts=3
shortyurl.liveness.timeout=30s
shortyurl.liveness.max-body-bytes=65536
