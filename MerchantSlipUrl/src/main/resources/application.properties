spring.application.name=MerchantSlipUrl
server.port=8080

spring.datasource.url=jdbc:h2:mem:merchantslipurl;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.security.user.name=merchant
spring.security.user.password=merchant

merchantslipurl.public-base-url=http://localhost:8080/
merchantslipurl.inactivity=5m

merchantslipurl.liveness.max-attempts=3
merchantslipurl.liveness.timeout=30s
merchantslipurl.liveness.max-body-bytes=65536
